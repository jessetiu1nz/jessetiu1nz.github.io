<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One NZ KPI Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --one-green: #00A651;
            --one-dark-green: #008542;
            --one-light-green: #33CC7A;
            --one-black: #111827;
            --one-dark-gray: #1F2937;
            --one-gray: #4B5563;
            --one-panel: rgba(255, 255, 255, 0.92);
            --one-border: rgba(15, 23, 42, 0.08);
            --one-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            --one-shadow-strong: 0 18px 40px rgba(15, 23, 42, 0.14);
            --one-ring: 0 0 0 4px rgba(0, 166, 81, 0.14);
        }

        * {
            box-sizing: border-box;
            transition: box-shadow 0.2s ease, transform 0.16s ease, border-color 0.16s ease, background 0.2s ease;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            letter-spacing: -0.01em;
            color: #0f172a;
            background:
                radial-gradient(circle at top left, rgba(51, 204, 122, 0.16), transparent 28%),
                radial-gradient(circle at top right, rgba(0, 166, 81, 0.10), transparent 24%),
                linear-gradient(180deg, #f7faf8 0%, #eef7f2 38%, #f5f7fb 100%);
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.28) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.28) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.22), transparent 70%);
            opacity: 0.35;
        }

        #app {
            position: relative;
            z-index: 1;
        }

        .tab-active {
            background: linear-gradient(135deg, #00A651 0%, #008542 100%);
            color: white;
            font-weight: 700;
            box-shadow: 0 14px 28px rgba(0, 166, 81, 0.24);
        }

        .hover-lift:hover {
            transform: translateY(-2px);
        }

        .card-shadow,
        .bg-white.rounded-2xl.shadow-lg,
        .bg-white.rounded-2xl.shadow-xl {
            box-shadow: var(--one-shadow) !important;
        }

        .card-shadow:hover,
        .bg-white.rounded-2xl.shadow-lg:hover,
        .bg-white.rounded-2xl.shadow-xl:hover {
            box-shadow: var(--one-shadow-strong) !important;
        }

        .progress-bar {
            animation: progressAnimation 1s ease-out;
        }

        @keyframes progressAnimation {
            from {
                width: 0;
            }
        }

        .gradient-one-green {
            background: linear-gradient(135deg, #00A651 0%, #008542 100%);
        }

        .gradient-one-green-light {
            background: linear-gradient(135deg, #33CC7A 0%, #00A651 100%);
        }

        .gradient-one-dark {
            background: linear-gradient(135deg, #2D2D2D 0%, #111827 100%);
        }

        .gradient-green-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .gradient-orange-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .gradient-red-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .metric-number {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.03em;
        }

        .btn-one-nz {
            background: linear-gradient(135deg, #00A651 0%, #008542 100%);
            box-shadow: 0 10px 20px rgba(0, 166, 81, 0.24);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-one-nz:hover {
            background: linear-gradient(135deg, #009249 0%, #006f38 100%);
            box-shadow: 0 16px 28px rgba(0, 166, 81, 0.30);
            transform: translateY(-1px);
        }

        button {
            border-radius: 14px;
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: none;
            box-shadow: var(--one-ring);
            border-color: rgba(0, 166, 81, 0.5) !important;
        }

        input,
        select,
        textarea {
            background: rgba(255, 255, 255, 0.96);
            border-color: rgba(148, 163, 184, 0.4) !important;
        }

        .bg-white.rounded-2xl,
        .bg-white.rounded-xl {
            background: var(--one-panel) !important;
            backdrop-filter: blur(10px);
            border-color: var(--one-border) !important;
        }

        .bg-gradient-to-r.from-gray-900.to-black.rounded-2xl {
            position: relative;
            overflow: hidden;
            box-shadow: 0 18px 40px rgba(17, 24, 39, 0.34) !important;
        }

        .bg-gradient-to-r.from-gray-900.to-black.rounded-2xl::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 12% 24%, rgba(51, 204, 122, 0.22), transparent 22%),
                radial-gradient(circle at 88% 18%, rgba(51, 204, 122, 0.10), transparent 18%);
            pointer-events: none;
        }

        .bg-white.rounded-2xl.shadow-lg.p-2.mb-6.border.border-gray-200 {
            position: sticky;
            top: 14px;
            z-index: 15;
            background: rgba(255, 255, 255, 0.82) !important;
            backdrop-filter: blur(16px);
            border-color: rgba(15, 23, 42, 0.06) !important;
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08) !important;
        }

        .bg-gray-50,
        .from-gray-50.to-gray-100,
        .from-gray-50.to-green-50 {
            border-color: rgba(15, 23, 42, 0.06);
        }

        .bg-blue-600.text-white,
        .bg-green-600.text-white:not(.btn-one-nz) {
            background: linear-gradient(135deg, #00A651 0%, #008542 100%) !important;
            box-shadow: 0 10px 22px rgba(0, 166, 81, 0.20);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .bg-blue-600.text-white:hover,
        .bg-green-600.text-white:hover:not(.btn-one-nz) {
            background: linear-gradient(135deg, #009249 0%, #006f38 100%) !important;
        }

        .bg-purple-600.text-white {
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%) !important;
            box-shadow: 0 10px 22px rgba(17, 24, 39, 0.18);
        }

        .bg-purple-600.text-white:hover {
            background: linear-gradient(135deg, #0f172a 0%, #111827 100%) !important;
        }

        .bg-red-500.to-red-600,
        .from-red-500.to-red-600 {
            box-shadow: 0 10px 22px rgba(239, 68, 68, 0.18);
        }

        .text-green-400 {
            color: #7cf0b0 !important;
        }

        .border-2.border-green-200,
        .border-2.border-blue-200,
        .border-2.border-purple-200,
        .border-2.border-amber-200 {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
        }

        .text-gray-600 {
            color: #475569 !important;
        }

        .text-gray-700 {
            color: #334155 !important;
        }

        .text-gray-900 {
            color: #0f172a !important;
        }

        .shadow-md,
        .shadow-lg,
        .shadow-xl {
            box-shadow: var(--one-shadow) !important;
        }
    </style>
</head>

<body class="min-h-screen">
    <div id="app" class="p-4 md:p-8 max-w-7xl mx-auto"></div>

    <script>

        window.history.replaceState({}, null, "/"); // Mask URL

        // Application State
        const STORAGE_KEY = 'kpiTrackerState';
        const FULL_TIME_HOURS = 40;
        const PART_TIME_HOURS = 20;
        let renderScheduled = false;

        const state = {
            activeTab: 'monthly',
            reps: ['Tane', 'Zaffreen', 'Tripti', 'Kevin', 'Mike', 'Ankit', 'Kalven'],
            kpis: [
                { name: 'Gross Profit', csvKey: 'Total Gross Profit', isCurrency: true },
                { name: 'General Merch Margin', csvKey: 'General Merchandise Margin', isCurrency: true },
                { name: 'Consumer New Connections', csvKey: 'Consumer On Account', isCurrency: false },
                { name: 'Pre2Post', csvKey: 'Consumer Pre2Post', isCurrency: false },
                { name: 'Consumer New Broadband', csvKey: 'Consumer New Broadband', isCurrency: false },
                { name: 'Business On Account', csvKey: 'Business On Account', isCurrency: false },
                { name: 'Business New Broadband', csvKey: 'Business new broadband', isCurrency: false }
            ],
            repHours: {
                'Tane': FULL_TIME_HOURS, 'Zaffreen': FULL_TIME_HOURS, 'Tripti': FULL_TIME_HOURS, 'Kevin': FULL_TIME_HOURS,
                'Mike': FULL_TIME_HOURS, 'Ankit': FULL_TIME_HOURS, 'Kalven': FULL_TIME_HOURS
            },
            monthly: {
                storeTargets: {},
                repTargets: {},
                actuals: {},
                daysInMonth: 31,
                daysRemaining: 15,
                closedDays: 0,
                editingStoreTargets: true,
                editingDays: false
            },
            multimonth: {
                storeTargets: {},
                repTargets: {},
                actuals: {},
                startDate: new Date().toISOString().split('T')[0],
                endDate: new Date(Date.now() + 90 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                editingStoreTargets: true,
                editingDates: false
            },
            editingHours: false,
            editingReps: false,
            newRepName: ''
        };

        // Initialize
        state.kpis.forEach(kpi => {
            state.monthly.storeTargets[kpi.name] = 0;
            state.multimonth.storeTargets[kpi.name] = 0;
        });

        // Load saved state from localStorage
        function loadState() {
            try {
                const savedState = localStorage.getItem(STORAGE_KEY);
                if (savedState) {
                    const parsed = JSON.parse(savedState);

                    // Restore state properties
                    if (parsed.activeTab) state.activeTab = parsed.activeTab;
                    if (parsed.reps) state.reps = parsed.reps;
                    if (parsed.repHours) state.repHours = parsed.repHours;
                    if (parsed.monthly) {
                        state.monthly = { ...state.monthly, ...parsed.monthly };
                    }
                    if (parsed.multimonth) {
                        state.multimonth = { ...state.multimonth, ...parsed.multimonth };
                    }

                    console.log('State loaded from localStorage');
                    return true;
                }
            } catch (error) {
                console.error('Error loading state:', error);
            }
            return false;
        }

        // Save state to localStorage
        function saveState() {
            try {
                const stateToSave = {
                    activeTab: state.activeTab,
                    reps: state.reps,
                    repHours: state.repHours,
                    monthly: state.monthly,
                    multimonth: state.multimonth
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
                console.log('State saved to localStorage');
            } catch (error) {
                console.error('Error saving state:', error);
            }
        }

        function requestRender() {
            if (renderScheduled) return;
            renderScheduled = true;
            requestAnimationFrame(() => {
                renderScheduled = false;
                render();
            });
        }

        // Save immediately, then batch DOM updates to the next frame
        function saveAndRender() {
            saveState();
            requestRender();
        }

        // Clear saved data
        function clearSavedData() {
            if (confirm('Are you sure you want to clear all saved data? This will reset everything to default.')) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        // Load saved state on startup
        const hasLoadedState = loadState();

        // Helper Functions
        function getCurrentPeriod() {
            return state.activeTab === 'monthly' ? state.monthly : state.multimonth;
        }


        function getPeriodByType(periodType) {
            if (periodType === 'monthly') return state.monthly;
            if (periodType === 'multimonth') return state.multimonth;
            return getCurrentPeriod();
        }

        function getDaysInfoForPeriod(periodType) {
            const period = getPeriodByType(periodType);
            if (periodType === 'monthly') {
                return {
                    totalDays: period.daysInMonth,
                    daysRemaining: period.daysRemaining,
                    daysElapsed: period.daysInMonth - period.daysRemaining
                };
            }

            const start = new Date(period.startDate);
            const end = new Date(period.endDate);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            start.setHours(0, 0, 0, 0);
            end.setHours(0, 0, 0, 0);

            const totalDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
            const daysElapsed = Math.max(0, Math.min(totalDays, Math.ceil((today - start) / (1000 * 60 * 60 * 24))));
            const daysRemaining = Math.max(0, totalDays - daysElapsed);
            return { totalDays, daysRemaining, daysElapsed };
        }

        function periodHasActuals(period) {
            return Object.keys(period.actuals).some(rep => Object.values(period.actuals[rep]).some(val => val > 0));
        }

        function getPeriodWithActuals(periodType) {
            return periodHasActuals(getPeriodByType(periodType));
        }

        function getExpectedProgress(daysInfo, periodType = null) {
            const type = periodType || (state.activeTab === 'leaderboard' ? getLeaderboardContext().periodType : state.activeTab);
            if (!daysInfo.totalDays || daysInfo.totalDays <= 0) return 0;

            if (type === 'monthly') {
                const closedDaysRemaining = getClosedDaysRemaining(daysInfo, 'monthly');
                const effectiveTotalDays = Math.max(1, daysInfo.totalDays - closedDaysRemaining);
                const effectiveDaysElapsed = Math.min(daysInfo.daysElapsed, effectiveTotalDays);
                return (effectiveDaysElapsed / effectiveTotalDays) * 100;
            }

            return (daysInfo.daysElapsed / daysInfo.totalDays) * 100;
        }

        function normalizeKey(value) {
            return String(value ?? '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '');
        }

        function getActiveReps() {
            return state.reps.filter(rep => (state.repHours[rep] || 0) > 0);
        }

        function getInactiveReps() {
            return state.reps.filter(rep => (state.repHours[rep] || 0) === 0);
        }

        function getLeaderboardContext() {
            if (getPeriodWithActuals('monthly')) {
                return {
                    periodType: 'monthly',
                    period: state.monthly,
                    daysInfo: getDaysInfoForPeriod('monthly'),
                    label: 'Monthly'
                };
            }

            return {
                periodType: 'multimonth',
                period: state.multimonth,
                daysInfo: getDaysInfoForPeriod('multimonth'),
                label: 'Multi-Month'
            };
        }

        function formatNumber(num, isCurrency = false) {
            if (isCurrency) {
                return '$' + num.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            }
            return num.toFixed(0);
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function getTotalHours() {
            return state.reps.reduce((sum, rep) => sum + (state.repHours[rep] || 0), 0);
        }

        function getDaysInfo() {
            return getDaysInfoForPeriod(state.activeTab === 'leaderboard' ? getLeaderboardContext().periodType : state.activeTab);
        }

        // Calculate working days (5 out of 7 days per week)
        function calculateWorkingDays(calendarDays) {
            // Treat current remaining days as inclusive selling days.
            // If 4 days remain in the month, there should be 4 selling days remaining.
            // We still preserve a minimum of the entered remaining days.
            return Math.max(0, Math.ceil(calendarDays));
        }

        function getMonthlyClosedDays() {
            return Math.max(0, parseInt(state.monthly.closedDays, 10) || 0);
        }

        function getClosedDaysRemaining(daysInfo, periodType = null) {
            const type = periodType || (state.activeTab === 'leaderboard' ? getLeaderboardContext().periodType : state.activeTab);
            if (type !== 'monthly') return 0;
            return Math.min(getMonthlyClosedDays(), Math.max(0, daysInfo.daysRemaining));
        }

        function getEffectiveWorkingDaysRemaining(daysInfo, periodType = null) {
            const baseWorkingDays = calculateWorkingDays(daysInfo.daysRemaining);
            const closedDaysRemaining = getClosedDaysRemaining(daysInfo, periodType);
            return Math.max(0, baseWorkingDays - closedDaysRemaining);
        }

        function getWorkingDaysInfo() {
            const calendarDays = getDaysInfo();
            return {
                totalWorkingDays: calculateWorkingDays(calendarDays.totalDays),
                workingDaysRemaining: getEffectiveWorkingDaysRemaining(calendarDays),
                workingDaysElapsed: calculateWorkingDays(calendarDays.daysElapsed),
                closedDaysRemaining: getClosedDaysRemaining(calendarDays),
                // Keep calendar days for display
                totalDays: calendarDays.totalDays,
                daysRemaining: calendarDays.daysRemaining,
                daysElapsed: calendarDays.daysElapsed
            };
        }

        function calculateRepTargets(periodType = null) {
            const type = periodType || state.activeTab;
            const period = type === 'monthly' ? state.monthly : state.multimonth;
            const calculated = {};
            const totalHours = getTotalHours();

            state.reps.forEach(rep => {
                calculated[rep] = {};
                const repWeeklyHours = state.repHours[rep] || 0;
                const repProportion = totalHours > 0 ? (repWeeklyHours / totalHours) : 0;

                state.kpis.forEach(kpi => {
                    calculated[rep][kpi.name] = (period.storeTargets[kpi.name] || 0) * repProportion;
                });
            });

            period.repTargets = calculated;
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            if (lines.length === 0) return null;

            const headerLine = lines[0].replace(/^﻿/, '');
            const headers = headerLine.split(',').map(h => h.replace(/"/g, '').trim());
            const normalizedHeaders = headers.map(normalizeKey);
            const data = {};

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if (!line.trim()) continue;

                const values = [];
                let current = '';
                let inQuotes = false;

                for (let char of line) {
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current.trim());

                const repName = values[0].replace(/"/g, '').trim();
                if (!repName) continue; // Skip empty rep names

                let matchedRep = null;

                const repNameLower = repName.toLowerCase();

                // First check existing reps for matches
                for (const rep of state.reps) {
                    const repLower = rep.toLowerCase();
                    if (repNameLower.includes(repLower) || repLower.includes(repNameLower)) {
                        matchedRep = rep;
                        break;
                    }
                }

                // Special name mappings
                if (repNameLower.includes('mingqi') || repNameLower.includes('mike')) matchedRep = 'Mike';
                if (repNameLower.includes('minh') || repNameLower.includes('kevin')) matchedRep = 'Kevin';

                // If no match found, use the CSV name directly and add to reps list
                if (!matchedRep) {
                    matchedRep = repName;
                    // Auto-add new reps found in CSV with 0 hours (won't affect targets)
                    if (!state.reps.includes(matchedRep)) {
                        state.reps.push(matchedRep);
                        state.repHours[matchedRep] = 0; // Set to 0 hours by default
                    }
                }

                if (matchedRep) {
                    if (!data[matchedRep]) data[matchedRep] = {};

                    for (let j = 0; j < headers.length; j++) {
                        const value = values[j] ? values[j].replace(/"/g, '').replace(/,/g, '').trim() : '';
                        const normalizedHeader = normalizedHeaders[j] || '';

                        state.kpis.forEach(kpi => {
                            if (normalizedHeader === normalizeKey(kpi.csvKey)) {
                                const numValue = parseFloat(value) || 0;
                                data[matchedRep][kpi.name] = (data[matchedRep][kpi.name] || 0) + numValue;
                            }
                        });
                    }
                }
            }
            return data;
        }

        function calculatePerformance(rep, kpiName) {
            const period = getCurrentPeriod();
            const target = period.repTargets[rep]?.[kpiName] || 0;
            const actual = period.actuals[rep]?.[kpiName] || 0;
            const daysInfo = getDaysInfo();
            const periodType = state.activeTab === 'leaderboard' ? getLeaderboardContext().periodType : state.activeTab;
            const expectedProgress = getExpectedProgress(daysInfo, periodType);
            const closedDaysRemaining = periodType === 'monthly' ? getClosedDaysRemaining(daysInfo, 'monthly') : 0;
            const effectiveTotalDays = periodType === 'monthly'
                ? Math.max(1, daysInfo.totalDays - closedDaysRemaining)
                : daysInfo.totalDays;
            const effectiveDaysElapsed = periodType === 'monthly'
                ? Math.min(daysInfo.daysElapsed, effectiveTotalDays)
                : daysInfo.daysElapsed;

            if (target === 0) return {
                percentage: 0, remaining: 0, status: 'none', actual, target,
                onPace: true, pacePercentage: 0, projectedTotal: 0,
                projectedShortfall: 0, expectedProgress: expectedProgress.toFixed(1), daysElapsed: effectiveDaysElapsed,
                isActiveTarget: false
            };

            const percentage = (actual / target) * 100;
            const remaining = target - actual;
            const pacePercentage = percentage - expectedProgress;
            const dailyRate = effectiveDaysElapsed > 0 ? actual / effectiveDaysElapsed : 0;
            const projectedTotal = dailyRate * effectiveTotalDays;
            const projectedShortfall = target - projectedTotal;
            const onPace = percentage >= expectedProgress - 5;

            let status = 'danger';
            if (percentage >= 90) status = 'success';
            else if (percentage >= 70) status = 'warning';

            return {
                percentage: percentage.toFixed(1), remaining, status, actual, target,
                onPace, pacePercentage: pacePercentage.toFixed(1),
                projectedTotal, projectedShortfall,
                expectedProgress: expectedProgress.toFixed(1),
                daysElapsed: effectiveDaysElapsed,
                isActiveTarget: true
            };
        }

        function getTeamSummary(kpiName) {
            const period = getCurrentPeriod();
            const totalTarget = period.storeTargets[kpiName] || 0;
            let totalActual = 0;

            // Include ALL reps in actuals calculation, even those with 0 hours
            state.reps.forEach(rep => {
                totalActual += period.actuals[rep]?.[kpiName] || 0;
            });

            const percentage = totalTarget > 0 ? (totalActual / totalTarget) * 100 : 0;
            const daysInfo = getDaysInfo();
            const periodType = state.activeTab === 'leaderboard' ? getLeaderboardContext().periodType : state.activeTab;
            const expectedProgress = getExpectedProgress(daysInfo, periodType);
            const onPace = percentage >= expectedProgress - 5;

            return {
                totalTarget, totalActual,
                percentage: percentage.toFixed(1),
                onPace, expectedProgress: expectedProgress.toFixed(1)
            };
        }

        function getRepKpiPerformance(period, rep, expectedProgress) {
            return state.kpis.map(kpi => {
                const target = period.repTargets[rep]?.[kpi.name] || 0;
                const actual = period.actuals[rep]?.[kpi.name] || 0;
                const percentage = target > 0 ? (actual / target) * 100 : 0;
                const onPace = target > 0 ? percentage >= expectedProgress - 5 : false;
                return { kpi, target, actual, percentage, onPace, isActiveTarget: target > 0 };
            });
        }

        function calculateLeaderboard() {
            const context = state.activeTab === 'leaderboard'
                ? getLeaderboardContext()
                : { period: getCurrentPeriod(), daysInfo: getDaysInfo() };
            const { period, daysInfo } = context;
            const periodType = context.periodType || (state.activeTab === 'leaderboard' ? getLeaderboardContext().periodType : state.activeTab);
            const expectedProgress = getExpectedProgress(daysInfo, periodType);

            const repScores = getActiveReps().map(rep => {
                const repData = getRepKpiPerformance(period, rep, expectedProgress);
                const activeKpis = repData.filter(d => d.isActiveTarget);
                const activeCount = activeKpis.length;
                const avgPerformance = activeCount > 0
                    ? activeKpis.reduce((sum, d) => sum + d.percentage, 0) / activeCount
                    : 0;
                const onPaceCount = activeKpis.filter(d => d.onPace).length;
                const overAchievement = activeCount > 0
                    ? activeKpis.reduce((sum, d) => sum + Math.max(0, d.percentage - 100), 0) / activeCount
                    : 0;
                const bestKpi = activeKpis.length > 0
                    ? Math.max(...activeKpis.map(d => d.percentage))
                    : 0;
                const variance = activeCount > 0 ? Math.abs(avgPerformance - expectedProgress) : 0;

                return {
                    rep,
                    avgPerformance: avgPerformance.toFixed(1),
                    variance: variance.toFixed(1),
                    onPaceCount,
                    hours: state.repHours[rep] || 0,
                    activeCount,
                    overAchievement: overAchievement.toFixed(1),
                    bestKpi: bestKpi.toFixed(1)
                };
            });

            // Sort by actual achievement first so a rep over 200% ranks above reps near 100%
            // Tie-breakers keep the list stable and still reward pace consistency.
            repScores.sort((a, b) => {
                const aPerf = parseFloat(a.avgPerformance);
                const bPerf = parseFloat(b.avgPerformance);
                if (Math.abs(bPerf - aPerf) > 0.1) {
                    return bPerf - aPerf;
                }

                const aBest = parseFloat(a.bestKpi);
                const bBest = parseFloat(b.bestKpi);
                if (Math.abs(bBest - aBest) > 0.1) {
                    return bBest - aBest;
                }

                const aOnPace = a.onPaceCount || 0;
                const bOnPace = b.onPaceCount || 0;
                if (bOnPace !== aOnPace) {
                    return bOnPace - aOnPace;
                }

                const aHours = a.hours || 0;
                const bHours = b.hours || 0;
                if (bHours !== aHours) {
                    return bHours - aHours;
                }

                return parseFloat(a.variance) - parseFloat(b.variance);
            });

            return repScores;
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = parseCSV(e.target.result);
                        if (parsed) {
                            const period = getCurrentPeriod();
                            Object.keys(parsed).forEach(rep => {
                                if (!period.actuals[rep]) period.actuals[rep] = {};
                                Object.keys(parsed[rep]).forEach(kpi => {
                                    period.actuals[rep][kpi] = (period.actuals[rep][kpi] || 0) + parsed[rep][kpi];
                                });
                            });
                            saveAndRender();
                        }
                    } catch (error) {
                        alert('Error parsing CSV');
                    }
                };
                reader.readAsText(file);
            }
            event.target.value = '';
        }

                state.reps = state.reps.filter(rep => rep !== repToRemove);

                                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                                            </svg>
                                            Performance data loaded
                                        </p>
                                    </div>
                                    <button onclick="if(confirm('Clear all uploaded performance data?\\n\\nThis will remove actual performance numbers but keep:\\n• Your team members\\n• Hours settings\\n• Store targets\\n• All other settings')) { getCurrentPeriod().actuals = {}; saveAndRender(); }" 
                                        class="w-full bg-gradient-to-r from-red-500 to-red-600 text-white px-4 py-3 rounded-lg hover:from-red-600 hover:to-red-700 transition-all shadow-md hover:shadow-lg font-semibold flex items-center justify-center gap-2">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                        </svg>
                                        Clear Actuals & Upload New
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                        <div class="bg-amber-50 border-2 border-amber-200 rounded-xl p-6">
                            <h3 class="font-semibold mb-3 text-gray-800 flex items-center gap-2">
                                <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                Instructions
                            </h3>
                            <ul class="text-sm text-amber-900 space-y-2">
                                <li class="flex items-start gap-2">
                                    <span class="text-amber-600 font-bold">1.</span>
                                    <span><strong>Upload CSV:</strong> Select your widget report files</span>
                                </li>
                                <li class="flex items-start gap-2">
                                    <span class="text-amber-600 font-bold">2.</span>
                                    <span><strong>Multiple files:</strong> Upload both widgets separately</span>
                                </li>
                                <li class="flex items-start gap-2">
                                    <span class="text-amber-600 font-bold">3.</span>
                                    <span><strong>Auto-add reps:</strong> Any names in CSV (like Nick, Mariette) are automatically added with 0 hours</span>
                                </li>
                                <li class="flex items-start gap-2">
                                    <span class="text-amber-600 font-bold">4.</span>
                                    <span><strong>Store totals:</strong> All rep actuals are included in store summary, even if they have 0 hours</span>
                                </li>
                                <li class="flex items-start gap-2">
                                    <span class="text-amber-600 font-bold">5.</span>
                                    <span><strong>Start fresh:</strong> Use "Clear Actuals" button to remove all performance data</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDashboard(period, daysInfo) {
            return `
                ${renderTeamSummary(daysInfo)}
                ${renderIndividualReps(daysInfo)}
            `;
        }

        function renderTeamSummary(daysInfo) {
            const zeroHourReps = getInactiveReps();

            return `
                <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8 mb-6 border border-gray-100">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold text-gray-900">Team Summary - Store Performance</h2>
                        ${zeroHourReps.length > 0 ? `
                            <div class="bg-blue-50 border-2 border-blue-200 rounded-lg px-4 py-2">
                                <div class="text-xs font-semibold text-blue-900">
                                    Includes ${zeroHourReps.length} support rep${zeroHourReps.length > 1 ? 's' : ''}: ${zeroHourReps.join(', ')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                        ${state.kpis.map(kpi => {
                const summary = getTeamSummary(kpi.name);
                const pct = parseFloat(summary.percentage);
                let bg = 'bg-red-100 border-red-300', txt = 'text-red-700';
                if (pct >= 100) { bg = 'bg-green-100 border-green-300'; txt = 'text-green-700'; }
                else if (pct >= 70) { bg = 'bg-amber-100 border-amber-300'; txt = 'text-amber-700'; }

                return `
                                <div class="${bg} border-2 rounded-lg p-4">
                                    <h3 class="font-semibold text-sm mb-2">${kpi.name}</h3>
                                    <div class="${txt} text-2xl font-bold">${summary.percentage}%</div>
                                    <div class="text-xs text-gray-600 mt-1">
                                        ${formatNumber(summary.totalActual, kpi.isCurrency)} / ${formatNumber(summary.totalTarget, kpi.isCurrency)}
                                    </div>
                                    <div class="text-xs font-semibold mt-2 ${pct >= 100 ? 'text-green-600' : (pct >= 70 ? 'text-amber-600' : 'text-red-600')}">
                                        ${pct >= 100 ? '✓ Achieved' : (pct >= 70 ? '⚠️ On Pace' : '⚠️ Behind')}
                                    </div>
                                </div>
                            `;
            }).join('')}
                    </div>

                    <div class="border-t-2 pt-6">
                        <h3 class="text-lg font-bold mb-4">Daily Run Rate (${getEffectiveWorkingDaysRemaining(daysInfo)} selling days left${state.activeTab === 'monthly' ? ` • ${getClosedDaysRemaining(daysInfo, 'monthly')} closed day${getClosedDaysRemaining(daysInfo, 'monthly') === 1 ? '' : 's'}` : ''})</h3>
                        ${daysInfo.daysRemaining > 0 ? `
                            <div class="bg-gradient-to-br from-blue-50 to-purple-50 rounded-xl p-6 border-2 border-blue-200">
                                <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-4">
                                    ${state.kpis.map(kpi => {
                const summary = getTeamSummary(kpi.name);
                const remaining = summary.totalTarget - summary.totalActual;
                const workingDaysRemaining = getEffectiveWorkingDaysRemaining(daysInfo);
                const dailyRate = workingDaysRemaining > 0 ? (remaining / workingDaysRemaining) : 0;
                // Set minimum daily rate to 1 if greater than 0
                const displayDailyRate = dailyRate > 0 && dailyRate < 1 ? 1 : dailyRate;

                return `
                                            <div class="bg-white rounded-lg p-4 border-l-4 ${remaining > 0 ? 'border-blue-500' : 'border-green-500'}">
                                                <div class="text-sm font-semibold mb-2">${kpi.name}</div>
                                                ${remaining > 0 ? `
                                                    <div class="text-2xl font-bold text-blue-700 mb-1">
                                                        ${formatNumber(displayDailyRate, kpi.isCurrency)}
                                                    </div>
                                                    <div class="text-xs text-gray-600">per day needed</div>
                                                ` : `
                                                    <div class="text-xl font-bold text-green-700">✓ Target Hit!</div>
                                                `}
                                            </div>
                                        `;
            }).join('')}
                                </div>
                            </div>
                        ` : '<div class="bg-amber-50 border-2 border-amber-200 rounded-lg p-6 text-center text-amber-700">No days remaining</div>'}
                    </div>
                </div>
            `;
        }

        function renderIndividualReps(daysInfo) {
            return `
                <div class="space-y-6">
                    ${getActiveReps().map(rep => {
                const repData = state.kpis.map(kpi => calculatePerformance(rep, kpi.name));
                const activeRepData = repData.filter(d => d.isActiveTarget);
                const avgPerf = activeRepData.length > 0
                    ? activeRepData.reduce((sum, d) => sum + parseFloat(d.percentage), 0) / activeRepData.length
                    : 0;
                const onPaceCount = activeRepData.filter(d => d.onPace).length;
                const hours = state.repHours[rep] || 0;

                let hoursBadgeColor, hoursLabel;
                if (hours === 40) {
                    hoursBadgeColor = 'bg-green-100 text-green-700';
                    hoursLabel = '40hrs';
                } else if (hours === 20) {
                    hoursBadgeColor = 'bg-blue-100 text-blue-700';
                    hoursLabel = '20hrs';
                } else {
                    hoursBadgeColor = 'bg-gray-100 text-gray-700';
                    hoursLabel = '0hrs';
                }

                return `
                            <div id="rep-card-${rep.replace(/\s+/g, '-')}" class="bg-white rounded-2xl shadow-lg p-6 md:p-8 mb-6 border border-gray-100">
                                <div class="flex justify-between items-center mb-6 pb-4 border-b-2 border-gray-100">
                                    <div class="flex items-center gap-3">
                                        <div class="gradient-one-green p-2 rounded-lg shadow-md">
                                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                            </svg>
                                        </div>
                                        <div>
                                            <h2 class="text-2xl font-bold text-gray-900">${rep}</h2>
                                            <span class="inline-block mt-1 px-3 py-1 rounded-full text-xs font-bold ${hoursBadgeColor}">
                                                ${hoursLabel}
                                            </span>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <button onclick="captureRepCard('${rep.replace(/'/g, "\\'")}')" 
                                            class="bg-blue-600 text-white px-4 py-2 rounded-xl hover:bg-blue-700 transition-colors text-sm flex items-center gap-2 font-semibold">
                                            📸 <span class="hidden sm:inline">Screenshot</span>
                                        </button>
                                        <div class="text-right bg-gradient-to-br ${avgPerf >= 100 ? 'from-green-50 to-green-100' : avgPerf >= 70 ? 'from-amber-50 to-amber-100' : 'from-red-50 to-red-100'} p-4 rounded-xl">
                                            <div class="text-xs font-bold ${avgPerf >= 100 ? 'text-green-700' : avgPerf >= 70 ? 'text-amber-700' : 'text-red-700'} uppercase tracking-wide">Overall Performance</div>
                                            <div class="text-4xl font-bold ${avgPerf >= 100 ? 'text-green-600' : avgPerf >= 70 ? 'text-amber-600' : 'text-red-600'} metric-number my-1">
                                                ${avgPerf.toFixed(0)}%
                                            </div>
                                            <div class="text-xs font-semibold ${avgPerf >= 100 ? 'text-green-600' : avgPerf >= 70 ? 'text-amber-600' : 'text-red-600'}">${onPaceCount} of ${state.kpis.length} on track</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                                    ${state.kpis.map(kpi => {
                    const perf = calculatePerformance(rep, kpi.name);
                    const pct = parseFloat(perf.percentage);
                    const expectedPct = parseFloat(perf.expectedProgress);
                    // Calculate selling days remaining (5 days per week)
                    const workingDaysRemaining = getEffectiveWorkingDaysRemaining(daysInfo);
                    const dailyNeeded = workingDaysRemaining > 0 ? perf.remaining / workingDaysRemaining : 0;
                    // Set minimum daily need to 1 if greater than 0
                    const displayDailyNeeded = dailyNeeded > 0 && dailyNeeded < 1 ? 1 : dailyNeeded;

                    // Determine status and colors
                    let borderColor, statusIcon, statusColor;

                    if (pct >= 100) {
                        borderColor = 'border-green-500';
                        statusIcon = '✓';
                        statusColor = 'text-green-600';
                    } else if (pct >= 70) {
                        borderColor = 'border-orange-500';
                        statusIcon = '⚠';
                        statusColor = 'text-orange-600';
                    } else {
                        borderColor = 'border-red-500';
                        statusIcon = '✗';
                        statusColor = 'text-red-600';
                    }

                    return `
                                            <div class="bg-white rounded-lg p-3 border-l-4 ${borderColor} shadow-sm hover:shadow-md transition-shadow">
                                                <!-- Header -->
                                                <div class="flex justify-between items-start mb-2">
                                                    <h3 class="text-xs font-bold text-gray-700 leading-tight pr-1">${kpi.name}</h3>
                                                    <span class="${statusColor} text-lg font-bold leading-none">${statusIcon}</span>
                                                </div>
                                                
                                                <!-- Main Metric -->
                                                <div class="mb-2">
                                                    <div class="text-2xl font-bold ${statusColor}">
                                                        ${pct.toFixed(0)}%
                                                    </div>
                                                    <div class="text-xs text-gray-500 mt-0.5">
                                                        Expected: ${expectedPct}%
                                                    </div>
                                                </div>
                                                
                                                <!-- Progress Bar -->
                                                <div class="mb-2">
                                                    <div class="w-full bg-gray-200 rounded-full h-1">
                                                        <div class="h-1 rounded-full transition-all ${pct >= 100 ? 'bg-green-500' :
                            pct >= 70 ? 'bg-orange-500' : 'bg-red-500'
                        }" style="width: ${Math.min(pct, 100)}%"></div>
                                                    </div>
                                                </div>
                                                
                                                <!-- Stats -->
                                                <div class="space-y-1 text-xs">
                                                    <div class="flex justify-between">
                                                        <span class="text-gray-600">Actual</span>
                                                        <span class="font-semibold text-gray-900">${formatNumber(perf.actual, kpi.isCurrency)}</span>
                                                    </div>
                                                    <div class="flex justify-between">
                                                        <span class="text-gray-600">Target</span>
                                                        <span class="font-semibold text-gray-900">${formatNumber(perf.target, kpi.isCurrency)}</span>
                                                    </div>
                                                    <div class="flex justify-between pb-1 border-b border-gray-200">
                                                        <span class="text-gray-600">To Go</span>
                                                        <span class="font-semibold text-gray-900">${formatNumber(perf.remaining, kpi.isCurrency)}</span>
                                                    </div>
                                                    
                                                    <!-- Daily Target -->
                                                    ${perf.remaining > 0 && daysInfo.daysRemaining > 0 ? `
                                                        <div class="pt-1">
                                                            <div class="flex justify-between items-center">
                                                                <span class="text-gray-600">Daily</span>
                                                                <span class="font-bold ${statusColor}">
                                                                    ${formatNumber(displayDailyNeeded, kpi.isCurrency)}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    ` : perf.remaining <= 0 ? `
                                                        <div class="pt-1 text-center">
                                                            <div class="font-bold text-green-600 text-xs">✓ Complete</div>
                                                        </div>
                                                    ` : ''}
                                                </div>
                                            </div>
                                        `;
                }).join('')}
                                </div>

                                <!-- Compact Daily Summary Section -->
                                <div class="mt-6 border-t-2 border-gray-200 pt-6">
                                    <div class="flex items-center justify-between mb-4">
                                        <h3 class="text-lg font-bold text-gray-800">Daily Targets Summary</h3>
                                        <button onclick="captureRepSummary('${rep.replace(/'/g, "\\'")}')" 
                                            class="bg-green-600 text-white px-3 py-1.5 rounded-xl hover:bg-green-700 text-xs flex items-center gap-1 font-semibold">
                                            📸 Screenshot Summary
                                        </button>
                                    </div>
                                    
                                    <div id="rep-summary-${rep.replace(/\s+/g, '-')}" class="bg-gradient-to-br from-gray-50 to-blue-50 rounded-xl p-4 border-2 border-gray-200">
                                        <!-- Rep Header -->
                                        <div class="flex items-center justify-between mb-4 pb-3 border-b-2 border-gray-300">
                                            <div class="flex items-center gap-2">
                                                <h4 class="text-xl font-bold text-gray-800">${rep}</h4>
                                                <span class="px-2 py-1 rounded-full text-xs font-semibold ${hoursBadgeColor}">
                                                    ${hoursLabel}
                                                </span>
                                            </div>
                                            <div class="text-right">
                                                <div class="text-xs text-gray-500 uppercase">Overall</div>
                                                <div class="text-2xl font-bold ${avgPerf >= 90 ? 'text-green-600' : avgPerf >= 70 ? 'text-orange-600' : 'text-red-600'}">
                                                    ${avgPerf.toFixed(0)}%
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Compact KPI Grid -->
                                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                                            ${state.kpis.map(kpi => {
                    const perf = calculatePerformance(rep, kpi.name);
                    const pct = parseFloat(perf.percentage);
                    const expectedPct = parseFloat(perf.expectedProgress);
                    // Calculate selling days remaining (5 days per week)
                    const workingDaysRemaining = getEffectiveWorkingDaysRemaining(daysInfo);
                    const dailyNeeded = workingDaysRemaining > 0 ? perf.remaining / workingDaysRemaining : 0;
                    const displayDailyNeeded = dailyNeeded > 0 && dailyNeeded < 1 ? 1 : dailyNeeded;

                    let borderColor, statusColor;
                    if (pct >= 100 || pct >= expectedPct - 5) {
                        borderColor = 'border-green-500';
                        statusColor = 'text-green-600';
                    } else if (pct >= expectedPct - 15) {
                        borderColor = 'border-orange-500';
                        statusColor = 'text-orange-600';
                    } else {
                        borderColor = 'border-red-500';
                        statusColor = 'text-red-600';
                    }

                    return `
                                                    <div class="bg-white rounded-lg p-3 border-l-4 ${borderColor} shadow-sm">
                                                        <div class="text-xs font-bold text-gray-700 mb-2 leading-tight">${kpi.name}</div>
                                                        <div class="text-2xl font-bold ${statusColor} mb-2">
                                                            ${pct.toFixed(0)}%
                                                        </div>
                                                        ${perf.remaining > 0 && daysInfo.daysRemaining > 0 ? `
                                                            <div class="pt-2 border-t border-gray-200">
                                                                <div class="text-xs text-gray-600">Daily Target</div>
                                                                <div class="text-base font-bold text-gray-900">
                                                                    ${formatNumber(displayDailyNeeded, kpi.isCurrency)}
                                                                </div>
                                                            </div>
                                                        ` : perf.remaining <= 0 ? `
                                                            <div class="pt-2 border-t border-green-300">
                                                                <div class="text-xs font-bold text-green-600">✓ Complete</div>
                                                            </div>
                                                        ` : ''}
                                                    </div>
                                                `;
                }).join('')}
                                        </div>

                                        <!-- Footer Info -->
                                        <div class="mt-3 pt-3 border-t border-gray-300 text-center">
                                            <div class="text-xs text-gray-600">
                                                ${getEffectiveWorkingDaysRemaining(daysInfo)} selling days remaining (${daysInfo.daysRemaining} calendar days${state.activeTab === 'monthly' ? `, ${getClosedDaysRemaining(daysInfo, 'monthly')} closed` : ''}) • ${state.activeTab === 'monthly' ? 'Monthly' : 'Multi-Month'} Targets
                                            </div>
                                            <div class="text-xs text-gray-500 mt-1">
                                                Daily targets based on 5-day work week
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
            }).join('')}
                </div>
            `;
        }

        function renderEmptyState() {
            return `
                <div class="bg-white rounded-2xl shadow-xl p-12 text-center">
                    <div class="text-gray-400 text-6xl mb-4">📊</div>
                    <h3 class="text-xl font-semibold text-gray-800 mb-2">No Performance Data Yet</h3>
                    <p class="text-gray-600">Targets and run rates are visible now. Upload CSV files when you want to add actual performance.</p>
                </div>
            `;
        }

        function renderNoActualsNotice() {
            return `
                <div class="bg-blue-50 border-2 border-blue-200 rounded-2xl shadow-lg p-6 mb-6">
                    <div class="flex items-start gap-3">
                        <svg class="w-6 h-6 text-blue-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <div>
                            <h3 class="text-lg font-bold text-blue-900 mb-1">Showing targets and run rates before upload</h3>
                            <p class="text-sm text-blue-800">
                                Actual performance is currently 0 for all reps, so these cards show split targets and the daily pace needed to hit them.
                                Upload a CSV anytime to layer actual performance on top.
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        // Auto-calculate current month days
        function autoCalculateMonthDays() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();

            // Get total days in current month
            const daysInCurrentMonth = new Date(year, month + 1, 0).getDate();

            // Get current day of month
            const currentDay = now.getDate();

            // Calculate days remaining INCLUDING today as a selling day
            // Example: if today is the 28th in a 31-day month, remaining = 4 (28,29,30,31)
            const daysRemainingInMonth = daysInCurrentMonth - currentDay + 1;

            return {
                daysInMonth: daysInCurrentMonth,
                daysRemaining: daysRemainingInMonth,
                currentDay: currentDay
            };
        }

        // Auto-update month days if enabled
        function updateMonthDaysAuto() {
            if (state.monthly.autoTrackDays) {
                const calculated = autoCalculateMonthDays();
                state.monthly.daysInMonth = calculated.daysInMonth;
                state.monthly.daysRemaining = calculated.daysRemaining;
                return true;
            }
            return false;
        }

        // Toggle auto-tracking
        function toggleAutoTracking() {
            state.monthly.autoTrackDays = !state.monthly.autoTrackDays;
            if (state.monthly.autoTrackDays) {
                updateMonthDaysAuto();
            }
            saveAndRender();
        }

        // Add auto-tracking toggle to monthly state if not present
        if (state.monthly.autoTrackDays === undefined) {
            state.monthly.autoTrackDays = true; // Default to enabled
        }

        // Initial render
        if (hasLoadedState) {
            calculateRepTargets('monthly');
            calculateRepTargets('multimonth');
            updateMonthDaysAuto();
        } else {
            // First time load - set auto tracking on
            updateMonthDaysAuto();
        }
        render();
    </script>
</body>

</html>
