<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesse's Toolkit</title>

    <style>
        :root {
            --green50: #CDFBDD;
            --green100: #95EEB4;
            --green200: #12CB77;

            --green400: #00A45F;
            --green600: #1B7C53;
            --green900: #0A3833;

            --white: #FFFFFF;
            --grey25: #F8F9FA;
            --grey50: #ECEEF1;
            --grey100: #E1E4E9;
            --grey200: #C5CAD5;
            --grey400: #8C96A8;
            --grey600: #5A6376;
            --grey900: #323232;

            --bg: var(--grey25);
            --surface: var(--white);
            --border: rgba(50, 50, 50, 0.10);
            --shadow-sm: 0 1px 2px rgba(10, 56, 51, 0.08);
            --shadow-md: 0 4px 12px rgba(10, 56, 51, 0.10);
            --radius-lg: 9px;

            --text: var(--grey900);
            --muted: var(--grey600);

            --container: 1080px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Euclid Circular, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background:
                radial-gradient(1200px 800px at 20% 0%, rgba(0, 164, 95, 0.08), transparent 60%),
                radial-gradient(900px 600px at 100% 10%, rgba(18, 203, 119, 0.08), transparent 55%),
                var(--bg);
            color: var(--text);
        }

        .page-container {
            min-height: 100vh;
            max-width: var(--container);
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: 16px;
        }

        header h1 {
            margin: 0;
            color: var(--green400);
            font-size: 32px;
        }

        main {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 40px 20px;
            text-align: center;
        }

        main h2 {
            margin-bottom: 12px;
            font-size: 22px;
        }

        main p {
            margin: 8px 0;
            color: var(--grey600);
            font-size: 15px;
        }

        a {
            color: var(--green600);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: auto;
            text-align: center;
            font-size: 13px;
            color: var(--grey600);
        }
    </style>
</head>

<body>
    <div class="page-container">
        <header>
            <h1>Jesse's Toolkit</h1>
        </header>

        <main>
            <h2>This page is currently unavailable</h2>

            <p>
                This toolkit has been taken offline until further notice.
            </p>

            <p>
                For any queries regarding any of the tools previously provided, please get in touch.
            </p>

            <p style="margin-top: 16px;">
                <a href="mailto:jesse.tiu@one.nz">jesse.tiu@one.nz</a>
            </p>
        </main>

        <footer>
            Created by Jesse Tiu 2025-2026
        </footer>
    </div>
</body>

</html>
